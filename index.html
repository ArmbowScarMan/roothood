<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roothood - 3D-hus</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #4ade80; }
        p { margin: 0; font-size: 13px; color: #a3a3a3; }
        
        #plant-card {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(24, 24, 27, 0.95);
            border: 1px solid #3f3f46;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            display: none;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #plant-card h3 { margin: 0 0 5px 0; color: #4ade80; }
        #plant-card p { margin: 0; color: #d4d4d8; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Mitt hem - 3D-vy</h1>
        <p>Dra med musen eller fingret för att rotera. Skrolla för att zooma.</p>
    </div>

    <div id="canvas-container"></div>

    <div id="plant-card">
        <h3 id="card-title">Växtnamn</h3>
        <p id="card-status">Status: Laddar...</p>
    </div>

    <!-- Ladda in Three.js och OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x18181b);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // Belysning
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(15, 25, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Husets golv
        const floorGeo = new THREE.BoxGeometry(16, 0.5, 12);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.25;
        floor.receiveShadow = true;
        scene.add(floor);

        // Väggar
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x3f3f46, roughness: 0.7 });
        function createWall(w, h, d, x, y, z) {
            const wallGeo = new THREE.BoxGeometry(w, h, d);
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(x, y, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
        }
        createWall(16, 2, 0.4, 0, 1, -6);
        createWall(0.4, 2, 12, -8, 1, 0);
        createWall(0.4, 2, 6, 8, 1, -3);

        // Växter och markörer
        const plantGeo = new THREE.SphereGeometry(0.6, 32, 32);
        const plantMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x14532d });
        
        const plantsData = [
            { name: "Monstera Albo", x: -5, z: -3, status: "Mår fantastiskt (Vattnad för 2 dagar sedan)" },
            { name: "Philodendron Florida Ghost", x: 4, z: -4, status: "Behöver vatten snart (Fuktighet: 20%)" },
            { name: "Alocasia Jacklyn", x: -3, z: 3, status: "Optimal miljö (22°C, 70% fukt)" },
            { name: "Terrarium (Kalle)", x: 5, z: 3, status: "Temperatur OK (28°C)" }
        ];

        const plantMeshes = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        plantsData.forEach((data) => {
            const plant = new THREE.Mesh(plantGeo, plantMat.clone());
            plant.position.set(data.x, 0.8, data.z);
            plant.userData = data;
            scene.add(plant);
            plantMeshes.push(plant);
        });

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(plantMeshes);

            const card = document.getElementById('plant-card');
            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                document.getElementById('card-title').innerText = data.name;
                document.getElementById('card-status').innerText = data.status;
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const time = Date.now() * 0.003;
            plantMeshes.forEach((p, i) => {
                const scale = 1 + Math.sin(time + i) * 0.1;
                p.scale.set(scale, scale, scale);
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
