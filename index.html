.top{display:flex;align-items:center;gap:10px;padding:18px 18px 4px}

.btn.wide{width:100%}
.btn.ghostbtn{background:var(--soft);color:var(--ink)}
.hero .btn{background:var(--onpri);color:var(--pri);padding:10px 16px}

.count{padding:10px 18px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 18px 0}
.card{border:0;padding:0;text-align:left;font:inherit;color:inherit;background:var(--surf);border-radius:22px;overflow:hidden;cursor:pointer}
.tile{background:hsl(var(--h) 42% 50% / .2);padding:10px 0 0;display:grid;place-items:center}
.tile svg{width:100px;height:100px}
.cb{padding:10px 12px 14px}
.cb i{display:block;font-size:13px;color:var(--mut);margin:2px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;background:var(--soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500}
.pill.warn{background:var(--acc);color:var(--surf)}
.empty{grid-column:1/-1;background:var(--surf);border-radius:22px;padding:20px;text-align:center}
.empty p{margin:0 0 14px;color:var(--mut)}
.dh{position:relative;background:hsl(var(--h) 42% 50% / .22);padding:60px 0 8px;display:grid;place-items:center}
.dh>svg{width:190px;height:190px}
.back{position:absolute;left:16px;top:16px;width:42px;height:42px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.sheet{margin-top:-22px;background:var(--bg);border-radius:28px 28px 0 0;position:relative;padding:22px 18px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.meter{background:var(--surf);border-radius:18px;padding:14px}
.meter b{display:block;margin-bottom:8px;font-weight:600}
.dots{display:flex;gap:6px;margin-bottom:8px}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots .f.s{background:var(--sun)}.dots .f.w{background:var(--wat)}
dl{margin:0;background:var(--surf);border-radius:20px;padding:4px 16px}
dl div{padding:12px 0;border-bottom:1px solid var(--line)}
dl div:last-child{border:0}
dt{font-size:13px;color:var(--mut)}
dd{margin:2px 0 0}
.tip{margin:14px 0 18px;background:var(--soft);border-radius:20px;padding:14px 16px;border-left:5px solid var(--pri)}
.list{padding:14px 18px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:20px 18px 0}

.mrow .grow{flex:1;min-width:0}
.mrow h3 button{all:unset;cursor:pointer}

.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

const POTS = ['#C98B5E','#7B8FA1','#A98B6F','#8FB0A3','#D48A5A'];
function art(cat, name) {
  const pc = POTS[hueOf(name) % POTS.length];
  const pot = `<path d="M40 82h40l-4 28H44z" fill="${pc}"/><rect x="35" y="76" width="50" height="10" rx="4" fill="${pc}"/>`;
  const fan = (as, rx, ry, cy, f) => as.map(a => `<ellipse cx="60" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${a} 60 78)" fill="${f}"/>`).join('');
  let b = '';
  switch (cat) {
    case 'Kaktus': b = `<rect x="48" y="26" width="24" height="56" rx="12" fill="#4F9A6A"/><rect x="28" y="44" width="16" height="30" rx="8" fill="#4F9A6A"/><rect x="76" y="38" width="16" height="30" rx="8" fill="#4F9A6A"/><circle cx="60" cy="24" r="6" fill="#E8749B"/>`; break;
    case 'Orkidé': b = `<ellipse cx="46" cy="72" rx="22" ry="7" fill="#3B7A4B" transform="rotate(-10 46 72)"/><ellipse cx="74" cy="72" rx="22" ry="7" fill="#3B7A4B" transform="rotate(10 74 72)"/><path d="M60 78C60 40 62 30 80 24" stroke="#5E8F4F" stroke-width="3" fill="none"/><g fill="#D9709A"><circle cx="80" cy="24" r="11"/><circle cx="62" cy="40" r="10"/><circle cx="58" cy="58" r="9"/></g><g fill="#F6E3A1"><circle cx="80" cy="24" r="3"/><circle cx="62" cy="40" r="3"/><circle cx="58" cy="58" r="3"/></g>`; break;
    case 'Köksträdgård': b = fan([-40, 0, 40], 7, 22, 50, '#3E8A47') + `<g fill="#D8412F"><circle cx="44" cy="46" r="10"/><circle cx="74" cy="38" r="10"/><circle cx="62" cy="62" r="9"/></g>`; break;
    case 'Trädgård': b = fan([-24, 0, 24], 3, 34, 44, '#5E8F4F') + fan([-24, 0, 24], 6, 15, 22, '#6F5BA8'); break;
    default: b = fan([-55, -25, 0, 25, 55], 17, 21, 42, '#2E7D5B') + fan([-40, 12, 42], 8, 10, 48, '#1F5E43');
  }
  return `<svg viewBox="0 0 120 120" aria-hidden="true">${b}${pot}</svg>`;
}

  },
  _save(f) { store.set('feed', f); },
  async feed() { return JSON.parse(JSON.stringify(this._feed())); },
  async ask(cat, body) { const f = this._feed(); f.unshift({ id: Date.now(), user_id: 'demo', author: 'Du', category: cat, body, created_at: new Date().toISOString(), best_answer_id: null, likers: [], answers: [] }); this._save(f); },
  async answer(pid, body) { const f = this._feed(); f.find(p => p.id === pid).answers.push({ id: Date.now(), user_id: 'demo', author: 'Du', body, created_at: new Date().toISOString() }); this._save(f); },
  async like(pid, on) { const f = this._feed(), p = f.find(x => x.id === pid); p.likers = p.likers.filter(x => x !== 'demo'); if (on) p.likers.push('demo'); this._save(f); },
  async best(pid, aid) { const f = this._feed(); f.find(p => p.id === pid).best_answer_id = aid; this._save(f); },
  async report() {},
  async delPost(id) { this._save(this._feed().filter(p => p.id !== id)); },
  async delAnswer(id) { const f = this._feed(); f.forEach(p => { p.answers = p.answers.filter(a => a.id !== id); if (p.best_answer_id === id) p.best_answer_id = null; }); this._save(f); }
};

let sb;
const sbApi = {
  async plants() {
    const { data, error } = await sb.from('plants').select('*').eq('status', 'approved').order('swedish_name');
    if (error) throw error; return data;
  },
  async user() {
    const { data } = await sb.auth.getSession();
    const u = data.session && data.session.user;
    return u ? { id: u.id, name: (u.user_metadata && u.user_metadata.display_name) || u.email } : null;
  },
  async signIn(email, pw) { const { error } = await sb.auth.signInWithPassword({ email, password: pw }); if (error) throw error; },
  async signUp(email, pw, name) {
    const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { display_name: name } } });
    if (error) throw error; return !!data.session;
  },
  async signOut() { await sb.auth.signOut(); },
  async mine() {
    const { data, error } = await sb.from('user_plants')
      .select('id,plant_id,last_watered,custom_name,custom_latin,custom_category,custom_water_interval_days,notes,plants(swedish_name,latin_name,category,water_interval_days)')
      .order('created_at');
    if (error) throw error;
    return data.map(r => r.plants
      ? { id: r.id, plant_id: r.plant_id, name: r.plants.swedish_name, latin: r.plants.latin_name, category: r.plants.category, interval: r.plants.water_interval_days, last_watered: r.last_watered, notes: r.notes, custom: false }
      : { id: r.id, plant_id: null, name: r.custom_name, latin: r.custom_latin, category: r.custom_category, interval: r.custom_water_interval_days, last_watered: r.last_watered, notes: r.notes, custom: true });
  },
  async addMine(p) { const { error } = await sb.from('user_plants').insert({ plant_id: p.id }); if (error) throw error; },
  async addCustom(f) {
    const { error } = await sb.from('user_plants').insert({ custom_name: f.name, custom_latin: f.latin || null, custom_category: f.cat, custom_water_interval_days: f.interval, notes: f.notes || null });
    if (error) throw error;
    if (f.suggest) {
      const { error: e2 } = await sb.from('plants').insert({
        swedish_name: f.name, latin_name: f.latin, category: f.cat, status: 'pending',
        light_level: f.light, water_level: f.water, light_text: LIGHT[f.light - 1],
        water_text: `Ungefär var ${f.interval}${ord(f.interval)} dag`, water_interval_days: f.interval,
        pet_safe: f.pet === 'true', tips: f.notes || null });
      if (e2) throw e2;
    }
  },
  async water(id) { const { error } = await sb.from('user_plants').update({ last_watered: today() }).eq('id', id); if (error) throw error; },
  async remove(id) { const { error } = await sb.from('user_plants').delete().eq('id', id); if (error) throw error; },
  async feed() {
    const { data: posts, error } = await sb.from('posts').select('id,user_id,category,body,best_answer_id,created_at').order('created_at', { ascending: false }).limit(50);
    if (error) throw error;
    if (!posts.length) return [];
    const ids = posts.map(p => p.id);
    const [a, l] = await Promise.all([
      sb.from('answers').select('id,post_id,user_id,body,created_at').in('post_id', ids).order('created_at'),
      sb.from('likes').select('post_id,user_id').in('post_id', ids)]);
    if (a.error) throw a.error;
    if (l.error) throw l.error;
    const uids = [...new Set(posts.map(p => p.user_id).concat(a.data.map(x => x.user_id)))];
    const { data: profs, error: e3 } = await sb.from('profiles').select('id,display_name').in('id', uids);
    if (e3) throw e3;
    const name = id => (profs.find(p => p.id === id) || {}).display_name || 'Okänd';
    return posts.map(p => ({ ...p, author: name(p.user_id),
      answers: a.data.filter(x => x.post_id === p.id).map(x => ({ ...x, author: name(x.user_id) })),
      likers: l.data.filter(x => x.post_id === p.id).map(x => x.user_id) }));
  },
  async ask(cat, body) { const { error } = await sb.from('posts').insert({ user_id: S.user.id, category: cat, body }); if (error) throw error; },
  async answer(pid, body) { const { error } = await sb.from('answers').insert({ post_id: pid, user_id: S.user.id, body }); if (error) throw error; },
  async like(pid, on) {
    const { error } = on ? await sb.from('likes').insert({ post_id: pid, user_id: S.user.id })
      : await sb.from('likes').delete().eq('post_id', pid).eq('user_id', S.user.id);
    if (error) throw error;
  },
  async best(pid, aid) { const { error } = await sb.from('posts').update({ best_answer_id: aid }).eq('id', pid); if (error) throw error; },
  async report(kind, id, reason) { const { error } = await sb.from('reports').insert({ reporter_id: S.user.id, [kind === 'post' ? 'post_id' : 'answer_id']: id, reason }); if (error) throw error; },
  async delPost(id) { const { error } = await sb.from('posts').delete().eq('id', id); if (error) throw error; },
  async delAnswer(id) { const { error } = await sb.from('answers').delete().eq('id', id); if (error) throw error; }
};

let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2800); }
async function run(fn, ok) {
  try { await fn(); S.mine = await api.mine(); if (ok) toast(ok); }
  catch (e) { toast(errMsg(e)); }
  render();
}
function go(t) { S.tab = t; S.sel = null; S.del = null; S.post = null; render(); $('#main').scrollTop = 0; if (t === 'comm') loadFeed(); }
function openPlant(id) { S.sel = id; render(); $('#main').scrollTop = 0; }
function openModal(m, prefill) { S.modal = m; S.msg = ''; S.prefill = prefill || ''; render(); const f = $('#ov input:not([type=checkbox])'); if (f) f.focus(); }
function closeModal() { S.modal = null; S.msg = ''; render(); }
function addPlant(id) {
  if (!S.user) return openModal('login');
  const p = S.plants.find(x => x.id === id);
  run(() => api.addMine(p), p.swedish_name + ' finns nu i din samling');
}
function addCustomStart() { if (!S.user) return openModal('login'); openModal('add', S.q); }
function water(id) { const m = S.mine.find(x => x.id === id); run(() => api.water(id), m.name + ' är vattnad'); }
function removeMine(id) {
  if (S.del !== id) { S.del = id; render(); return; }
  S.del = null; const m = S.mine.find(x => x.id === id);
  run(() => api.remove(id), m.name + ' är borttagen');
}
async function saveCustom(form) {
  const d = Object.fromEntries(new FormData(form));
  const f = { name: d.name.trim(), latin: (d.latin || '').trim(), cat: d.cat, interval: +d.interval, notes: (d.notes || '').trim(), suggest: !!d.suggest, light: +d.light, water: +d.water, pet: d.pet };
  if (f.suggest && !f.latin) { S.msg = 'Fyll i latinskt namn för att föreslå växten.'; return renderModalKeep(form); }
  if (f.suggest && !f.pet) { S.msg = 'Välj om växten är giftig för husdjur.'; return renderModalKeep(form); }
  S.modal = null;
  await run(() => api.addCustom(f), f.suggest ? f.name + ' är tillagd. Förslaget granskas innan det syns för andra.' : f.name + ' finns nu i din samling');
}
function renderModalKeep(form) {
  const p = form.querySelector('.formmsg') || document.createElement('p');
  p.className = 'formmsg'; p.textContent = S.msg; form.querySelector('.formbtn').before(p);
}
async function doAuth(form) {
  const d = Object.fromEntries(new FormData(form));
  S.authEmail = d.email; S.authName = d.name || '';
  S.busy = true; S.msg = ''; render();
  try {
    if (S.authMode === 'up') {
      const active = await api.signUp(d.email.trim(), d.pw, d.name.trim());
      if (!active) { S.busy = false; S.authMode = 'in'; S.msgOk = true; S.msg = 'Vi har skickat en länk till ' + d.email + '. Klicka på den och logga sedan in här.'; return render(); }
    } else await api.signIn(d.email.trim(), d.pw);
    S.user = await api.user(); S.mine = await api.mine();
    S.busy = false; S.modal = null; render(); toast('Välkommen, ' + S.user.name + '!');
  } catch (e) { S.busy = false; S.msgOk = false; S.msg = errMsg(e); render(); }
}
async function signOut() { await api.signOut(); S.user = null; S.mine = []; render(); toast('Du är utloggad'); }

}
// ===== Community =====
const QCATS = ['Allmänt'].concat(CATS);
const REASONS = ['Olämpligt eller elakt', 'Spam eller reklam', 'Farliga eller felaktiga råd', 'Annat'];
function ago(t) {
  const s = (Date.now() - Date.parse(t)) / 1000;
  if (s < 60) return 'nyss';
  if (s < 3600) return Math.floor(s / 60) + ' min sedan';
  if (s < 86400) return Math.floor(s / 3600) + ' tim sedan';
  const d = Math.floor(s / 86400);
  if (d === 1) return 'igår';
  if (d < 7) return d + ' dagar sedan';
  return new Date(t).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
}
function needLogin() { if (!S.user) { openModal('login'); return true; } return false; }
async function loadFeed() {
  try { S.feed = await api.feed(); S.feedErr = null; } catch (e) { S.feedErr = errMsg(e); }
  render();
}
async function commRun(fn, ok) {
  try { await fn(); S.feed = await api.feed(); if (ok) toast(ok); } catch (e) { toast(errMsg(e)); }
  render();
}
function openPost(id) { S.post = id; S.adraft = ''; S.del = null; render(); $('#main').scrollTop = 0; }
function askQ() {
  if (needLogin()) return;
  const v = S.draft.trim();
  if (v.length < 5) return toast('Skriv minst 5 tecken.');
  S.draft = '';
  commRun(() => api.ask(S.qcat, v), 'Din fråga är publicerad');
}
function sendAnswer(pid) {
  if (needLogin()) return;
  const v = S.adraft.trim();
  if (v.length < 2) return toast('Skriv ett svar först.');
  S.adraft = '';
  commRun(() => api.answer(pid, v), 'Ditt svar är publicerat');
}
function toggleLike(pid) {
  if (needLogin()) return;
  const p = S.feed.find(x => x.id === pid), on = !p.likers.includes(S.user.id);
  p.likers = on ? p.likers.concat(S.user.id) : p.likers.filter(x => x !== S.user.id);
  render();
  commRun(() => api.like(pid, on));
}
function markBest(pid, aid) { commRun(() => api.best(pid, aid), 'Markerat som bästa svar'); }
function delPost(id) {
  if (S.del !== 'p' + id) { S.del = 'p' + id; return render(); }
  S.del = null; S.post = null;
  commRun(() => api.delPost(id), 'Frågan är borttagen');
}
function delAnswer(id) {
  if (S.del !== 'a' + id) { S.del = 'a' + id; return render(); }
  S.del = null;
  commRun(() => api.delAnswer(id), 'Svaret är borttaget');
}
function openReport(kind, id) { if (needLogin()) return; S.rep = { kind, id }; openModal('report'); }
function sendReport(form) {
  const r = new FormData(form).get('reason');
  S.modal = null;
  commRun(() => api.report(S.rep.kind, S.rep.id, r), 'Tack! Rapporten är skickad.');
}
function who(name, sub, pill) {
  return `<div class="who"><div class="av" style="background:hsl(${hueOf(name)} 40% 38%)">${esc((name || '?')[0])}</div><div><b>${esc(name)}</b><br><span class="mut">${esc(sub)}</span></div>${pill || ''}</div>`;
}
function likeBtn(p) {
  const on = !!(S.user && p.likers.includes(S.user.id));
  return `<button class="like ${on ? 'on' : ''}" onclick="toggleLike(${p.id})" aria-pressed="${on}" aria-label="Gilla">♥ ${p.likers.length}</button>`;
}
function delBtn(key, fn, id) {
  const sure = S.del === key + id;
  return `<button class="x ${sure ? 'sure' : ''}" onclick="${fn}(${id})">${sure ? 'Bekräfta' : 'Ta bort'}</button>`;
}
function postCard(p) {
  const best = p.answers.find(a => a.id === p.best_answer_id);
  return `<div class="post">${who(p.author, ago(p.created_at), `<span class="pill">${esc(p.category)}</span>`)}
  <h3><button class="plink" onclick="openPost(${p.id})">${esc(p.body)}</button></h3>
  ${best ? `<div class="ans"><b>Bästa svar</b>${esc(best.body)}</div>` : ''}
  <div class="prow">${likeBtn(p)}<button class="link2" onclick="openPost(${p.id})">${p.answers.length ? p.answers.length + ' svar' : 'Svara'}</button></div></div>`;
}
function comm() {
  if (S.post) return postV();
  let body;
  if (S.feedErr) body = `<div class="empty"><p>${esc(S.feedErr)}</p><button class="btn sm" onclick="loadFeed()">Försök igen</button></div>`;
  else if (!S.feed) body = '<p class="mut" style="text-align:center">Hämtar frågor…</p>';
  else if (!S.feed.length) body = '<div class="empty"><p>Inga frågor än. Bli först med att fråga något!</p></div>';
  else body = S.feed.map(postCard).join('');
  return `<div class="pad" style="padding-top:20px"><h1>Community</h1><p class="mut" style="margin:8px 0 0">Fråga och hjälp andra växtvänner i Sverige.</p></div>
  <div class="ask"><textarea id="nq" rows="2" maxlength="1000" placeholder="Vad undrar du över?" aria-label="Din fråga" oninput="S.draft=this.value">${esc(S.draft)}</textarea>
  <div class="askrow"><select aria-label="Kategori" onchange="S.qcat=this.value">${QCATS.map(c => `<option ${c === S.qcat ? 'selected' : ''}>${c}</option>`).join('')}</select><button class="btn sm" onclick="askQ()">Publicera</button></div></div>
  <div class="pad">${body}</div>`;
}
function postV() {
  const p = S.feed && S.feed.find(x => x.id === S.post);
  if (!p) { S.post = null; return comm(); }
  const mine = !!(S.user && p.user_id === S.user.id);
  const ans = [...p.answers].sort((a, b) => (b.id === p.best_answer_id) - (a.id === p.best_answer_id));
  return `<div class="pad" style="padding-top:16px"><button class="link2" onclick="S.post=null;S.del=null;render()">‹ Alla frågor</button>
  <div class="post" style="margin-top:10px">${who(p.author, ago(p.created_at), `<span class="pill">${esc(p.category)}</span>`)}<h2 style="font-size:21px">${esc(p.body)}</h2>
  <div class="prow">${likeBtn(p)}<span class="grow"></span>${mine ? delBtn('p', 'delPost', p.id) : `<button class="x" onclick="openReport('post',${p.id})">Rapportera</button>`}</div></div>
  <h3 style="margin:20px 0 10px">${p.answers.length ? p.answers.length + ' svar' : 'Inga svar än'}</h3>
  ${ans.map(a => {
    const isBest = a.id === p.best_answer_id, own = !!(S.user && a.user_id === S.user.id);
    return `<div class="post ${isBest ? 'bestc' : ''}">${who(a.author, ago(a.created_at), isBest ? '<span class="pill ok">Bästa svar</span>' : '')}<p style="margin:0">${esc(a.body)}</p>
    <div class="prow">${mine && !isBest ? `<button class="link2" onclick="markBest(${p.id},${a.id})">Markera som bästa svar</button>` : ''}<span class="grow"></span>${own ? delBtn('a', 'delAnswer', a.id) : `<button class="x" onclick="openReport('answer',${a.id})">Rapportera</button>`}</div></div>`;
  }).join('')}
  <div class="ask" style="margin:14px 0 0"><textarea id="na" rows="3" maxlength="1000" placeholder="Skriv ett svar" aria-label="Ditt svar" oninput="S.adraft=this.value">${esc(S.adraft)}</textarea><div style="margin-top:10px"><button class="btn sm" onclick="sendAnswer(${p.id})">Skicka svar</button></div></div></div>`;
}
function reportV() {
  return `<div class="mh"><h2>Rapportera</h2><button class="close" onclick="closeModal()" aria-label="Stäng">×</button></div>
  <p class="mut" style="margin:0 0 14px">Vad är fel? Rapporten går till den som sköter appen.</p>
  <form onsubmit="event.preventDefault();sendReport(this)">${REASONS.map((r, i) => `<label class="check"><input type="radio" name="reason" value="${r}" ${i === 0 ? 'checked' : ''}><span>${r}</span></label>`).join('')}
  <button class="btn wide formbtn">Skicka rapport</button></form>`;
}

// ===== Start =====
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('Kunde inte ladda ' + src)); document.head.appendChild(s); }); }
async function init() {
  render();
  try {
    if (!DEMO) {
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
      // Skickar headers som ett vanligt objekt, så att appen även fungerar i förhandsvisningar som inte klarar Headers-objekt
      const plainFetch = (input, init = {}) => {
        const opts = { ...init };
        if (opts.headers instanceof Headers) opts.headers = Object.fromEntries(opts.headers.entries());
        if (!opts.signal) delete opts.signal;
        return fetch(input, opts);
      };
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { global: { fetch: plainFetch } });
      api = sbApi;
    }
    S.plants = await api.plants();
    S.user = await api.user();
    S.mine = S.user ? await api.mine() : [];
  } catch (e) { S.err = e; }
  S.loading = false; render();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) closeModal(); });
init();
</script></body></html>
