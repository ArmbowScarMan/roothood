<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roothood</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F3F0;--surf:#FFFFFF;--ink:#1A1F1B;--mut:#7A837B;--line:#E4E9E3;--pri:#2E7D32;--pri2:#4CAF50;--onpri:#FFFFFF;--acc:#D64545;--soft:#E9F3E9;--sun:#F0A92B;--wat:#2F9AD3;--sh:0 8px 22px rgba(28,58,30,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1411;--surf:#1A211C;--ink:#E9EFEA;--mut:#95A397;--line:#2A342C;--pri:#6CC070;--pri2:#5DB862;--onpri:#0F1411;--acc:#F07575;--soft:#1F2C22;--sun:#F3BC57;--wat:#62B6E4;--sh:0 8px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1411;--surf:#1A211C;--ink:#E9EFEA;--mut:#95A397;--line:#2A342C;--pri:#6CC070;--pri2:#5DB862;--onpri:#0F1411;--acc:#F07575;--soft:#1F2C22;--sun:#F3BC57;--wat:#62B6E4;--sh:0 8px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
@media (min-width:600px){body{background:var(--line)}#app{height:min(100% - 40px,880px);margin:20px auto;border-radius:40px;box-shadow:var(--sh)}}
#main{flex:1;overflow-y:auto;padding-bottom:110px}
.pad{padding:0 18px}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.015em}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:16px;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:22px 18px 10px}
.sec h2{font-size:19px}

/* Toppfält */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:14px 18px 6px}
.top h1{font-size:19px;font-weight:800;text-align:center}
.circ{width:44px;height:44px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);position:relative;padding:0}
.circ.flat{box-shadow:none;background:none;cursor:default}
.logo{width:40px;height:40px;border-radius:13px;background:var(--pri);display:grid;place-items:center}
.dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surf)}
.badge{display:inline-block;font-size:12px;font-weight:600;background:var(--surf);color:var(--mut);border-radius:999px;padding:4px 10px;box-shadow:var(--sh)}

/* Sök */
.searchrow{display:flex;gap:10px;padding:10px 18px 0}
.search{position:relative;flex:1}
.search svg{position:absolute;left:16px;top:14px;color:var(--mut)}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.search input{padding:13px 16px 13px 46px;border:0;border-radius:999px;box-shadow:var(--sh)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* Foton */
.ph{position:relative;overflow:hidden;background:hsl(var(--h) 38% 86%);display:grid;place-items:center}
.ph>svg{width:72%;height:72%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ph.has-img img{opacity:1}
.ph.has-img>svg{visibility:hidden}

/* Hero */
.hero{position:relative;margin:16px 18px 0;border-radius:28px;overflow:hidden;min-height:190px;box-shadow:var(--sh);background:var(--pri)}
.hero .ph{position:absolute;inset:0}
.hero .ph>svg{width:46%;height:auto;position:absolute;right:-6%;bottom:-8%}
.shade{position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,30,12,.78) 0%,rgba(10,30,12,.45) 55%,rgba(10,30,12,.05) 100%)}
.hero-t{position:relative;padding:22px 20px 20px;color:#fff;max-width:80%}
.hero-t h2{font-size:24px;line-height:1.12}
.hero-t p{margin:8px 0 16px;font-size:14px;opacity:.9}
.pillbtn{border:0;background:#fff;color:#1A1F1B;font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:10px 18px;cursor:pointer}
.pillbtn.green{background:var(--pri2);color:#fff}

/* Flikar */
.tabs{display:flex;gap:22px;overflow-x:auto;padding:0 18px;border-bottom:1px solid var(--line);margin:0 18px;padding:0;scrollbar-width:none}
.tab{flex:none;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;font-size:15px;padding:6px 0 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--ink);font-weight:800}

/* Växtrutnät */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding:16px 18px 0}
.card{position:relative}
.card .open{all:unset;display:block;cursor:pointer;width:100%}
.card .open:focus-visible{outline:2px solid var(--pri);outline-offset:3px;border-radius:24px}
.card .ph{aspect-ratio:1/1.05;border-radius:24px;box-shadow:var(--sh)}
.card h3{margin:10px 2px 0;font-size:15px}
.card i{display:block;font-size:13px;color:var(--mut);margin:1px 2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.88);display:grid;place-items:center;cursor:pointer;color:#B9BDB9;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.heart.on{color:var(--acc)}
.empty{grid-column:1/-1;background:var(--surf);border-radius:24px;padding:22px;text-align:center;box-shadow:var(--sh)}
.empty p{margin:0 0 14px;color:var(--mut)}

/* Knappar */
.btn{border:0;background:var(--pri);color:var(--onpri);font:inherit;font-weight:700;border-radius:999px;padding:13px 20px;cursor:pointer}
.btn:active,.circ:active,.heart:active,.pillbtn:active,.wbtn:active{transform:scale(.95)}
.btn.wide{width:100%}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.line{background:none;color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.btn[disabled]{background:var(--soft);color:var(--mut);box-shadow:none;cursor:default}
.link{border:0;background:none;color:var(--pri);font:inherit;font-weight:700;padding:0;cursor:pointer}
.x{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px}
.x.sure{color:var(--acc)}

/* Växtsida */
.dhero{position:relative;margin:6px 18px 0;border-radius:30px;overflow:hidden;aspect-ratio:1.25/1;box-shadow:var(--sh)}
.dhero .ph{position:absolute;inset:0}
.dhero .shade{background:linear-gradient(0deg,rgba(8,26,10,.82) 0%,rgba(8,26,10,.25) 55%,rgba(8,26,10,0) 100%)}
.dhero-t{position:absolute;left:0;right:0;bottom:0;padding:18px;color:#fff}
.dhero-t h1{font-size:30px}
.dhero-t i{display:block;opacity:.9;margin:2px 0 12px}
.credit{display:block;text-align:right;font-size:11px;color:var(--mut);padding:6px 22px 0}
.credit a{color:inherit}
.tag{display:inline-block;background:var(--surf);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:var(--sh)}
.tag.green{background:var(--pri2);color:#fff;box-shadow:none}
.tag.warn{background:var(--acc);color:#fff;box-shadow:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.ti{background:var(--surf);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--sh);position:relative;min-height:128px}
.ti small{display:block;color:var(--mut);font-size:13px;font-weight:600}
.ti b{display:block;color:var(--pri);font-size:16px;font-weight:800;margin:2px 0 6px;padding-right:34px}
.ti b.bad{color:var(--acc)}
.ti p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ti .ic{position:absolute;top:12px;right:12px}
.tips{padding:0 18px;display:flex;flex-direction:column;gap:10px}
.tipr{display:flex;gap:12px;align-items:flex-start;background:var(--surf);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.tipr .ck{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center}
.tipr b{display:block;font-size:13px;color:var(--mut);font-weight:600}
.tipr span{font-size:14.5px}
.addbar{padding:18px 18px 0}

/* Min samling */
.summary{margin:12px 18px 0;background:var(--pri);color:var(--onpri);border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.summary b{font-size:28px;font-weight:800;line-height:1}
.summary span{font-size:14px;opacity:.9}
.list{padding:14px 18px 0;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;gap:12px;align-items:center;background:var(--surf);border-radius:24px;padding:10px;box-shadow:var(--sh)}
.mrow .ph{width:74px;height:74px;border-radius:18px;flex:none}
.mrow .grow{flex:1;min-width:0}
.mrow h3 button{all:unset;cursor:pointer}
.mrow h3 button:focus-visible{outline:2px solid var(--pri)}
.side{display:flex;flex-direction:column;align-items:center;gap:2px}
.wbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--pri);color:var(--onpri);display:grid;place-items:center;cursor:pointer}
.wbtn.due{background:var(--wat)}
.bar{height:7px;border-radius:9px;background:var(--line);margin:8px 0 5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:9px}
.bar.due i{background:var(--wat)}
.due-t{color:var(--wat);font-weight:700;font-size:14px}
.note{font-size:13px;color:var(--mut);margin-top:3px}
.mini{display:inline-block;background:var(--soft);color:var(--pri);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;margin-top:3px}

/* Profil */
.prof{margin:16px 18px 0;background:var(--surf);border-radius:28px;padding:24px 18px;text-align:center;box-shadow:var(--sh)}
.bigav{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800;background:var(--pri)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px 0}
.stat{background:var(--surf);border-radius:22px;padding:16px;box-shadow:var(--sh)}
.stat b{display:block;color:var(--pri);font-size:26px;font-weight:800}
.about{margin:12px 18px 0;color:var(--mut);font-size:13.5px;text-align:center}

/* Community */
.post{background:var(--surf);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.who{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.who>div:not(.av){flex:1;line-height:1.25}
.pill{display:inline-block;background:var(--soft);color:var(--pri);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.pill.ok{background:var(--pri);color:var(--onpri)}
.ans{background:var(--soft);border-radius:18px;padding:12px 14px;margin:12px 0 0;font-size:15px}
.ans b{display:block;font-size:12.5px;color:var(--pri);margin-bottom:2px}
.like{border:0;background:var(--soft);color:var(--mut);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.like.on{background:var(--acc);color:#fff}
.ask{background:var(--surf);border-radius:24px;padding:14px;margin:12px 18px 6px;box-shadow:var(--sh)}
.ask textarea{border:0;background:var(--bg);resize:none;border-radius:16px}
.askrow{display:flex;gap:10px;margin-top:10px}
.askrow select{flex:1;padding:9px 12px;background:var(--bg);border:0;border-radius:999px}
.prow{display:flex;gap:14px;align-items:center;margin-top:12px}
.prow .grow{flex:1}
.plink{all:unset;cursor:pointer}
.plink:focus-visible{outline:2px solid var(--pri)}
.link2{border:0;background:none;color:var(--pri);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px 0}
.bestc{box-shadow:inset 0 0 0 2px var(--pri),var(--sh)}
.center{padding:80px 24px;text-align:center}

/* Bottenmeny */
nav{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0));display:flex;justify-content:space-between;align-items:center;background:var(--surf);border-radius:999px;padding:8px;box-shadow:0 10px 30px rgba(20,50,22,.16);z-index:5}
nav button{border:0;width:52px;height:52px;border-radius:999px;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;padding:0;flex:none}
nav button span{display:none}
nav button.on{width:auto;padding:0 18px;background:var(--surf);color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
nav button.on span{display:inline}

/* Rutor och formulär */
.ov{position:absolute;inset:0;background:rgba(8,20,10,.45);z-index:10;display:flex;align-items:flex-end}
.modal{width:100%;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0))}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.close{width:40px;height:40px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:var(--sh)}
form label{display:block;font-size:14px;font-weight:700;margin-bottom:14px}
form label input,form label select,form label textarea{margin-top:6px;font-weight:400}
form label.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;background:var(--surf);border-radius:16px;padding:12px 14px}
form label.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--pri)}
.modal label.check{margin-bottom:8px}
.modal label.check+.formbtn{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{background:var(--surf);border-radius:18px;padding:14px 14px 2px;margin-bottom:14px}
.seg{display:flex;background:var(--surf);border-radius:999px;padding:4px;margin-bottom:16px;box-shadow:var(--sh)}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:10px 0;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--onpri)}
.formmsg{background:var(--surf);border-left:4px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.formmsg.ok{border-color:var(--pri)}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;width:max-content;max-width:calc(100% - 40px)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"><div id="main"></div>

<button data-t="home" onclick="go('home')" aria-label="Växter"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-6h-5v6H4z"/></svg><span>Växter</span></button>
<button data-t="mine" onclick="go('mine')" aria-label="Min samling"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12V7M12 7c0-2.5 2-4 4.5-4 0 2.5-2 4-4.5 4zM12 9c0-2-1.6-3.2-3.6-3.2 0 2 1.6 3.2 3.6 3.2zM6 12h12l-1.4 8H7.4z"/></svg><span>Min samling</span></button>
<button data-t="comm" onclick="go('comm')" aria-label="Community"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10h-7l-4 4v-4H5z"/></svg><span>Community</span></button>
<button data-t="me" onclick="go('me')" aria-label="Profil"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg><span>Profil</span></button>
</nav>
<div id="ov"></div><div id="toast" class="toast" hidden role="status"></div>

function art(cat, name) {
  const pc = POTS[hueOf(name) % POTS.length];
  const pot = `<path d="M40 82h40l-4 28H44z" fill="${pc}"/><rect x="35" y="76" width="50" height="10" rx="4" fill="${pc}"/>`;
  const fan = (as, rx, ry, cy, f) => as.map(a => `<ellipse cx="60" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${a} 60 78)" fill="${f}"/>`).join('');
  let b = '';
  switch (cat) {
    case 'Kaktus': b = `<rect x="48" y="26" width="24" height="56" rx="12" fill="#4F9A6A"/><rect x="28" y="44" width="16" height="30" rx="8" fill="#4F9A6A"/><rect x="76" y="38" width="16" height="30" rx="8" fill="#4F9A6A"/><circle cx="60" cy="24" r="6" fill="#E8749B"/>`; break;
    case 'Orkidé': b = `<ellipse cx="46" cy="72" rx="22" ry="7" fill="#3B7A4B" transform="rotate(-10 46 72)"/><ellipse cx="74" cy="72" rx="22" ry="7" fill="#3B7A4B" transform="rotate(10 74 72)"/><path d="M60 78C60 40 62 30 80 24" stroke="#5E8F4F" stroke-width="3" fill="none"/><g fill="#D9709A"><circle cx="80" cy="24" r="11"/><circle cx="62" cy="40" r="10"/><circle cx="58" cy="58" r="9"/></g><g fill="#F6E3A1"><circle cx="80" cy="24" r="3"/><circle cx="62" cy="40" r="3"/><circle cx="58" cy="58" r="3"/></g>`; break;
    case 'Köksträdgård': b = fan([-40, 0, 40], 7, 22, 50, '#3E8A47') + `<g fill="#D8412F"><circle cx="44" cy="46" r="10"/><circle cx="74" cy="38" r="10"/><circle cx="62" cy="62" r="9"/></g>`; break;
    case 'Trädgård': b = fan([-24, 0, 24], 3, 34, 44, '#5E8F4F') + fan([-24, 0, 24], 6, 15, 22, '#6F5BA8'); break;
    default: b = fan([-55, -25, 0, 25, 55], 17, 21, 42, '#2E7D5B') + fan([-40, 12, 42], 8, 10, 48, '#1F5E43');
  }
  return `<svg viewBox="0 0 120 120" aria-hidden="true">${b}${pot}</svg>`;
}

let sb;
const sbApi = {
  async plants() {
    const { data, error } = await sb.from('plants').select('*').eq('status', 'approved').order('swedish_name');
    if (error) throw error; return data;
  },
  async user() {
    const { data } = await sb.auth.getSession();
    const u = data.session && data.session.user;
    return u ? { id: u.id, name: (u.user_metadata && u.user_metadata.display_name) || u.email } : null;
  },
  async signIn(email, pw) { const { error } = await sb.auth.signInWithPassword({ email, password: pw }); if (error) throw error; },
  async signUp(email, pw, name) {
    const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { display_name: name } } });
    if (error) throw error; return !!data.session;
  },
  async signOut() { await sb.auth.signOut(); },
  async mine() {
    const { data, error } = await sb.from('user_plants')
      .select('id,plant_id,last_watered,custom_name,custom_latin,custom_category,custom_water_interval_days,notes,plants(swedish_name,latin_name,category,water_interval_days)')
      .order('created_at');
    if (error) throw error;
    return data.map(r => r.plants
      ? { id: r.id, plant_id: r.plant_id, name: r.plants.swedish_name, latin: r.plants.latin_name, category: r.plants.category, interval: r.plants.water_interval_days, last_watered: r.last_watered, notes: r.notes, custom: false }
      : { id: r.id, plant_id: null, name: r.custom_name, latin: r.custom_latin, category: r.custom_category, interval: r.custom_water_interval_days, last_watered: r.last_watered, notes: r.notes, custom: true });
  },
  async addMine(p) { const { error } = await sb.from('user_plants').insert({ plant_id: p.id }); if (error) throw error; },
  async addCustom(f) {
    const { error } = await sb.from('user_plants').insert({ custom_name: f.name, custom_latin: f.latin || null, custom_category: f.cat, custom_water_interval_days: f.interval, notes: f.notes || null });
    if (error) throw error;
    if (f.suggest) {
      const { error: e2 } = await sb.from('plants').insert({
        swedish_name: f.name, latin_name: f.latin, category: f.cat, status: 'pending',
        light_level: f.light, water_level: f.water, light_text: LIGHT[f.light - 1],
        water_text: `Ungefär var ${f.interval}${ord(f.interval)} dag`, water_interval_days: f.interval,
        pet_safe: f.pet === 'true', tips: f.notes || null });
      if (e2) throw e2;
    }
  },
  async water(id) { const { error } = await sb.from('user_plants').update({ last_watered: today() }).eq('id', id); if (error) throw error; },
  async remove(id) { const { error } = await sb.from('user_plants').delete().eq('id', id); if (error) throw error; },
  async feed() {
    const { data: posts, error } = await sb.from('posts').select('id,user_id,category,body,best_answer_id,created_at').order('created_at', { ascending: false }).limit(50);
    if (error) throw error;
    if (!posts.length) return [];
    const ids = posts.map(p => p.id);
    const [a, l] = await Promise.all([
      sb.from('answers').select('id,post_id,user_id,body,created_at').in('post_id', ids).order('created_at'),
      sb.from('likes').select('post_id,user_id').in('post_id', ids)]);
    if (a.error) throw a.error;
    if (l.error) throw l.error;
    const uids = [...new Set(posts.map(p => p.user_id).concat(a.data.map(x => x.user_id)))];
    const { data: profs, error: e3 } = await sb.from('profiles').select('id,display_name').in('id', uids);
    if (e3) throw e3;
    const name = id => (profs.find(p => p.id === id) || {}).display_name || 'Okänd';
    return posts.map(p => ({ ...p, author: name(p.user_id),
      answers: a.data.filter(x => x.post_id === p.id).map(x => ({ ...x, author: name(x.user_id) })),
      likers: l.data.filter(x => x.post_id === p.id).map(x => x.user_id) }));
  },
  async ask(cat, body) { const { error } = await sb.from('posts').insert({ user_id: S.user.id, category: cat, body }); if (error) throw error; },
  async answer(pid, body) { const { error } = await sb.from('answers').insert({ post_id: pid, user_id: S.user.id, body }); if (error) throw error; },
  async like(pid, on) {
    const { error } = on ? await sb.from('likes').insert({ post_id: pid, user_id: S.user.id })
      : await sb.from('likes').delete().eq('post_id', pid).eq('user_id', S.user.id);
    if (error) throw error;
  },
  async best(pid, aid) { const { error } = await sb.from('posts').update({ best_answer_id: aid }).eq('id', pid); if (error) throw error; },
  async report(kind, id, reason) { const { error } = await sb.from('reports').insert({ reporter_id: S.user.id, [kind === 'post' ? 'post_id' : 'answer_id']: id, reason }); if (error) throw error; },
  async delPost(id) { const { error } = await sb.from('posts').delete().eq('id', id); if (error) throw error; },
  async delAnswer(id) { const { error } = await sb.from('answers').delete().eq('id', id); if (error) throw error; }
};

async function saveCustom(form) {
  const d = Object.fromEntries(new FormData(form));
  const f = { name: d.name.trim(), latin: (d.latin || '').trim(), cat: d.cat, interval: +d.interval, notes: (d.notes || '').trim(), suggest: !!d.suggest, light: +d.light, water: +d.water, pet: d.pet };

async function doAuth(form) {
  const d = Object.fromEntries(new FormData(form));
  S.authEmail = d.email; S.authName = d.name || '';
  S.busy = true; S.msg = ''; render();
  try {
    if (S.authMode === 'up') {
      const active = await api.signUp(d.email.trim(), d.pw, d.name.trim());
      if (!active) { S.busy = false; S.authMode = 'in'; S.msgOk = true; S.msg = 'Vi har skickat en länk till ' + d.email + '. Klicka på den och logga sedan in här.'; return render(); }

    S.user = await api.user(); S.mine = await api.mine();

// ===== Foton från Wikipedia (illustration visas om inget foto finns) =====
const IMG = store.get('imgs', {});
const imgTried = new Set();
let imgBusy = false;
function ph(latin, cat, name, cls) {
  return `<div class="ph ${cls || ''}" data-latin="${esc(latin || '')}" style="--h:${hueOf(name)}">${art(cat, name)}</div>`;
}
function showPhotos() {
  document.querySelectorAll('.ph[data-latin]').forEach(el => {
    const u = IMG[el.dataset.latin];
    if (u && !el.querySelector('img')) {
      const im = new Image(); im.alt = '';
      im.onload = () => el.classList.add('has-img');
      im.src = u.src; el.appendChild(im);
    }
  });
}
async function loadPhotos() {
  showPhotos();
  if (imgBusy) return;
  const want = [...new Set([...document.querySelectorAll('.ph[data-latin]')].map(e => e.dataset.latin))]
    .filter(l => l && !(l in IMG) && !imgTried.has(l));
  if (!want.length) return;
  imgBusy = true; want.forEach(l => imgTried.add(l));
  try {
    for (let i = 0; i < want.length; i += 40) {
      const batch = want.slice(i, i + 40);
      const r = await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=640&redirects=1&format=json&origin=*&titles=' + encodeURIComponent(batch.join('|')));
      const q = (await r.json()).query || {};
      const follow = (t, arr) => { const m = (arr || []).find(x => x.from === t); return m ? m.to : t; };
      const pages = Object.values(q.pages || {});
      batch.forEach(l => {
        const t = follow(follow(l, q.normalized), q.redirects);
        const p = pages.find(x => x.title === t);
        IMG[l] = p && p.thumbnail ? { src: p.thumbnail.source, page: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g, '_')) } : null;
      });
    }
    store.set('imgs', IMG);
  } catch (e) { /* inget nät till Wikipedia: illustrationerna visas */ }
  imgBusy = false;
  showPhotos();
}

  return `${topbar('Roothood')}${DEMO ? '<p style="text-align:center;margin:0"><span class="badge" title="Ingen databas kopplad. Det du gör sparas bara i den här webbläsaren.">Demoläge</span></p>' : ''}
  <div class="searchrow"><div class="search">${ic(I.search, null, 20)}<input type="search" placeholder="Sök växt eller latinskt namn" value="${esc(S.q)}" oninput="S.q=this.value;renderList()" aria-label="Sök växter"></div></div>
  <div class="hero">${ph(fp.latin_name, fp.category, fp.swedish_name || 'x')}<div class="shade"></div><div class="hero-t">${t}</div></div>
  <div class="sec"><h2>Kategorier</h2><span class="mut" id="count"></span></div>
  <div class="tabs" role="tablist">${['Alla'].concat(CATS).map(c => `<button class="tab ${c === S.cat ? 'on' : ''}" role="tab" aria-selected="${c === S.cat}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>
  <div class="grid" id="list"></div>`;
}
function renderList() {
  const q = S.q.trim().toLowerCase();
  const r = S.plants.filter(p => (S.cat === 'Alla' || p.category === S.cat) && (p.swedish_name + ' ' + p.latin_name).toLowerCase().includes(q));
  $('#count').textContent = r.length + (r.length === 1 ? ' växt' : ' växter');
  $('#list').innerHTML = r.map(p => {
    const has = S.mine.some(m => m.plant_id === p.id);
    return `<div class="card"><button class="open" onclick="openPlant(${p.id})">${ph(p.latin_name, p.category, p.swedish_name)}<h3>${esc(p.swedish_name)}</h3><i>${esc(p.latin_name)}</i></button>
    <button class="heart ${has ? 'on' : ''}" onclick="heart(${p.id})" aria-pressed="${has}" aria-label="${has ? 'Finns i din samling' : 'Lägg till i min samling'}">${ic(I.heart, 'currentColor', 20).replace('fill="none"', has ? 'fill="currentColor"' : 'fill="none"')}</button></div>`;
  }).join('') + `<div class="empty"><p>${r.length ? 'Saknas din växt?' : 'Ingen växt matchar sökningen.'} Lägg till den själv och föreslå den till databasen.</p><button class="btn sm" onclick="addCustomStart()">Lägg till egen växt</button></div>`;
  loadPhotos();
}
function heart(id) {
  if (S.mine.some(m => m.plant_id === id)) return toast('Finns redan i din samling');
  addPlant(id);
}
function shortTemp(t) { const m = /\d+\s*–\s*\d+\s*°C/.exec(t || ''); return m ? m[0] : (t || '').split(',')[0]; }
function tile(label, value, desc, icon, color, bad) {
  return `<div class="ti">${ic(icon, color)}<small>${label}</small><b class="${bad ? 'bad' : ''}">${esc(value)}</b>${desc ? `<p>${esc(desc)}</p>` : ''}</div>`;
}
function detail() {
  const p = S.plants.find(x => x.id === S.sel), my = S.mine.find(m => m.plant_id === p.id);
  const d = my ? left(my) : null;
  const water = p.water_interval_days ? `Var ${p.water_interval_days}${ord(p.water_interval_days)} dag` : WATER[p.water_level - 1];
  const tips = [['Tips', p.tips], ['Vanliga problem', p.common_problems], ['Förökning', p.propagation], ['Odlingszon', p.hardiness_zone && 'Härdig i zon ' + p.hardiness_zone]].filter(t => t[1]);
  const credit = IMG[p.latin_name] ? `<span class="credit">Foto: <a href="${esc(IMG[p.latin_name].page)}" target="_blank" rel="noopener">Wikipedia</a></span>` : '';
  return `${topbar(p.category, 'S.sel=null;render()')}
  <div class="dhero">${ph(p.latin_name, p.category, p.swedish_name)}<div class="shade"></div><div class="dhero-t"><h1>${esc(p.swedish_name)}</h1><i>${esc(p.latin_name)}</i>
  ${my ? `<span class="tag green">${d === null ? 'I din samling' : d === 0 ? 'Vattna idag' : 'Vattnas om ' + d + (d === 1 ? ' dag' : ' dagar')}</span>` : `<button class="pillbtn green" onclick="addPlant(${p.id})">+ Lägg till i min samling</button>`}</div></div>${credit}
  <div class="sec"><h2>Skötsel</h2><span class="tag ${p.pet_safe ? '' : 'warn'}">${p.pet_safe ? 'Husdjurssäker' : 'Giftig för husdjur'}</span></div>
  <div class="tiles">
  ${tile('Ljus', LIGHT[p.light_level - 1], p.light_text, I.sun, 'var(--sun)')}
  ${tile('Vatten', water, p.water_text, I.drop, 'var(--wat)')}
  ${p.temperature ? tile('Temperatur', shortTemp(p.temperature), p.temperature, I.temp, 'var(--acc)') : ''}
  ${p.humidity ? tile('Luftfuktighet', p.humidity, '', I.mist, 'var(--pri2)') : ''}
  ${p.soil ? tile('Jord', p.soil.split(',')[0], p.soil, I.soil, '#A0703F') : ''}
  ${tile('Husdjur', p.pet_safe ? 'Ofarlig' : 'Giftig', p.toxicity_text, I.paw, p.pet_safe ? 'var(--pri2)' : 'var(--acc)', !p.pet_safe)}
  </div>
  ${tips.length ? `<div class="sec"><h2>Skötseltips</h2></div><div class="tips">${tips.map(t => `<div class="tipr"><span class="ck">${ic(I.check, 'currentColor', 16)}</span><div><b>${t[0]}</b><span>${esc(t[1])}</span></div></div>`).join('')}</div>` : ''}
  ${my ? '' : `<div class="addbar"><button class="btn wide" onclick="addPlant(${p.id})">Lägg till i min samling</button></div>`}`;
}
function mineV() {
  if (!S.user) return `${topbar('Min samling')}<div class="list"><div class="empty"><p>Logga in för att spara dina växter och få vattningspåminnelser.</p><button class="btn sm" onclick="openModal('login')">Logga in eller skapa konto</button></div></div>`;
  const due = S.mine.filter(m => left(m) === 0).length;
  const rows = S.mine.map(m => {
    const d = left(m), pct = m.interval ? Math.round((m.interval - d) / m.interval * 100) : 0;
    const status = d === null ? '<span class="mut">Växer ute, vattna vid torka</span>' : d === 0 ? '<span class="due-t">Vattna idag</span>' : `<span class="mut">Vattnas om ${d} ${d === 1 ? 'dag' : 'dagar'}</span>`;
    const title = m.custom ? esc(m.name) : `<button onclick="openPlant(${m.plant_id})">${esc(m.name)}</button>`;
    return `<div class="mrow">${ph(m.latin, m.category, m.name)}<div class="grow"><h3>${title}</h3>${m.custom ? '<span class="mini">Egen växt</span>' : ''}${d !== null ? `<div class="bar ${d === 0 ? 'due' : ''}"><i style="width:${pct}%"></i></div>` : '<div style="height:6px"></div>'}${status}${m.notes ? `<div class="note">${esc(m.notes)}</div>` : ''}</div>
      <div class="side">${d !== null ? `<button class="wbtn ${d === 0 ? 'due' : ''}" onclick="water(${m.id})" aria-label="Markera ${esc(m.name)} som vattnad">${ic(I.drop, 'currentColor', 22)}</button>` : ''}<button class="x ${S.del === m.id ? 'sure' : ''}" onclick="removeMine(${m.id})">${S.del === m.id ? 'Bekräfta' : 'Ta bort'}</button></div></div>`;
  }).join('');
  return `${topbar('Min samling')}
  ${S.mine.length ? `<div class="summary"><b>${S.mine.length}</b><span>${S.mine.length === 1 ? 'växt' : 'växter'} i samlingen<br>${due ? due + ' behöver vatten idag' : 'Alla har vatten just nu'}</span></div>` : ''}
  <div class="sec"><h2>Dina växter</h2><button class="btn sm line" onclick="addCustomStart()">+ Egen växt</button></div>
  <div class="list" style="padding-top:0">${rows || `<div class="empty"><p>Tryck på hjärtat på en växt under Växter så hamnar den här, med vattningspåminnelser.</p><button class="btn sm" onclick="go('home')">Hitta växter</button></div>`}</div>`;
}
function meV() {
  if (!S.user) return `${topbar('Profil')}<div class="prof"><div class="bigav">?</div><h2>Välkommen till Roothood</h2><p class="mut">Skapa ett konto för att spara växter och vara med i communityn.</p><button class="btn" onclick="openModal('login')">Logga in eller skapa konto</button></div>`;
  const posts = S.feed ? S.feed.filter(p => p.user_id === S.user.id).length : null;
  return `${topbar('Profil')}<div class="prof"><div class="bigav" style="background:hsl(${hueOf(S.user.name)} 40% 38%)">${esc((S.user.name || '?')[0].toUpperCase())}</div><h2>${esc(S.user.name)}</h2>${DEMO ? '<p class="mut">Demoläge: allt sparas bara i den här webbläsaren.</p>' : ''}</div>
  <div class="stats"><div class="stat"><b>${S.mine.length}</b><span class="mut">växter i samlingen</span></div><div class="stat"><b>${posts === null ? '–' : posts}</b><span class="mut">frågor i communityn</span></div></div>
  ${DEMO ? '' : `<div class="addbar"><button class="btn wide line" onclick="signOut()">Logga ut</button></div>`}
  <p class="about">Roothood: växtfolk som hjälper varandra.</p>`;
}
function loginV() {
  const up = S.authMode === 'up';
  return `<div class="mh"><h2>${up ? 'Skapa konto' : 'Logga in'}</h2><button class="close" onclick="closeModal()" aria-label="Stäng">×</button></div>
  <div class="seg"><button class="${up ? '' : 'on'}" onclick="S.authMode='in';S.msg='';render()">Logga in</button><button class="${up ? 'on' : ''}" onclick="S.authMode='up';S.msg='';render()">Skapa konto</button></div>
  <form onsubmit="event.preventDefault();doAuth(this)">
  ${up ? '<label>Namn som andra ser<input name="name" required maxlength="40" autocomplete="nickname" value="' + esc(S.authName) + '"></label>' : ''}
  <label>E-post<input name="email" type="email" required autocomplete="email" value="${esc(S.authEmail)}"></label>
  <label>Lösenord<input name="pw" type="password" required minlength="6" autocomplete="${up ? 'new-password' : 'current-password'}"></label>
  ${S.msg ? `<p class="formmsg ${S.msgOk ? 'ok' : ''}">${esc(S.msg)}</p>` : ''}
  <button class="btn wide formbtn" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Vänta…' : up ? 'Skapa konto' : 'Logga in'}</button></form>`;
}
function addV() {
  const opts = (arr, sel) => arr.map((t, i) => `<option value="${i + 1}" ${i + 1 === sel ? 'selected' : ''}>${t}</option>`).join('');
  return `<div class="mh"><h2>Lägg till egen växt</h2><button class="close" onclick="closeModal()" aria-label="Stäng">×</button></div>
  <form onsubmit="event.preventDefault();saveCustom(this)">
  <label>Namn<input name="name" required maxlength="60" value="${esc(S.prefill)}" placeholder="t.ex. Elefantöra"></label>
  <label>Latinskt namn (valfritt)<input name="latin" maxlength="80" placeholder="t.ex. Alocasia"></label>
  <div class="row2"><label>Kategori<select name="cat">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
  <label>Vattna var … dag<input name="interval" type="number" min="1" max="90" value="7" required></label></div>
  <label>Anteckningar (valfritt)<textarea name="notes" rows="2" maxlength="300" placeholder="t.ex. Står i köksfönstret"></textarea></label>
  <label class="check"><input type="checkbox" name="suggest" onchange="document.getElementById('sg').hidden=!this.checked"><span>Föreslå växten till databasen så att andra kan hitta den</span></label>
  <div id="sg" class="sub" hidden><div class="row2"><label>Ljus<select name="light">${opts(LIGHT, 2)}</select></label><label>Vatten<select name="water">${opts(WATER, 2)}</select></label></div>
  <label>Giftig för husdjur?<select name="pet"><option value="">Välj</option><option value="false">Ja, giftig</option><option value="true">Nej, ofarlig</option></select></label>
  <p class="mut" style="margin:0 0 12px">Förslaget granskas innan det syns för andra.</p></div>
  <button class="btn wide formbtn">Lägg till i min samling</button></form>`;
}
// ===== Community =====
const QCATS = ['Allmänt'].concat(CATS);
const REASONS = ['Olämpligt eller elakt', 'Spam eller reklam', 'Farliga eller felaktiga råd', 'Annat'];
function ago(t) {
  const s = (Date.now() - Date.parse(t)) / 1000;
  if (s < 60) return 'nyss';
  if (s < 3600) return Math.floor(s / 60) + ' min sedan';
  if (s < 86400) return Math.floor(s / 3600) + ' tim sedan';
  const d = Math.floor(s / 86400);
  if (d === 1) return 'igår';
  if (d < 7) return d + ' dagar sedan';
  return new Date(t).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
}
function needLogin() { if (!S.user) { openModal('login'); return true; } return false; }
async function loadFeed() {
  try { S.feed = await api.feed(); S.feedErr = null; } catch (e) { S.feedErr = errMsg(e); }
  render();
}
async function commRun(fn, ok) {
  try { await fn(); S.feed = await api.feed(); if (ok) toast(ok); } catch (e) { toast(errMsg(e)); }
  render();
}
function openPost(id) { S.post = id; S.adraft = ''; S.del = null; render(); $('#main').scrollTop = 0; }
function askQ() {
  if (needLogin()) return;
  const v = S.draft.trim();
  if (v.length < 5) return toast('Skriv minst 5 tecken.');
  S.draft = '';
  commRun(() => api.ask(S.qcat, v), 'Din fråga är publicerad');
}
function sendAnswer(pid) {
  if (needLogin()) return;
  const v = S.adraft.trim();
  if (v.length < 2) return toast('Skriv ett svar först.');
  S.adraft = '';
  commRun(() => api.answer(pid, v), 'Ditt svar är publicerat');
}
function toggleLike(pid) {
  if (needLogin()) return;
  const p = S.feed.find(x => x.id === pid), on = !p.likers.includes(S.user.id);
  p.likers = on ? p.likers.concat(S.user.id) : p.likers.filter(x => x !== S.user.id);
  render();
  commRun(() => api.like(pid, on));
}
function markBest(pid, aid) { commRun(() => api.best(pid, aid), 'Markerat som bästa svar'); }
function delPost(id) {
  if (S.del !== 'p' + id) { S.del = 'p' + id; return render(); }
  S.del = null; S.post = null;
  commRun(() => api.delPost(id), 'Frågan är borttagen');
}
function delAnswer(id) {
  if (S.del !== 'a' + id) { S.del = 'a' + id; return render(); }
  S.del = null;
  commRun(() => api.delAnswer(id), 'Svaret är borttaget');
}
function openReport(kind, id) { if (needLogin()) return; S.rep = { kind, id }; openModal('report'); }
function sendReport(form) {
  const r = new FormData(form).get('reason');
  S.modal = null;
  commRun(() => api.report(S.rep.kind, S.rep.id, r), 'Tack! Rapporten är skickad.');
}
function who(name, sub, pill) {
  return `<div class="who"><div class="av" style="background:hsl(${hueOf(name)} 40% 38%)">${esc((name || '?')[0])}</div><div><b>${esc(name)}</b><br><span class="mut">${esc(sub)}</span></div>${pill || ''}</div>`;
}
function likeBtn(p) {
  const on = !!(S.user && p.likers.includes(S.user.id));
  return `<button class="like ${on ? 'on' : ''}" onclick="toggleLike(${p.id})" aria-pressed="${on}" aria-label="Gilla">♥ ${p.likers.length}</button>`;
}
function delBtn(key, fn, id) {
  const sure = S.del === key + id;
  return `<button class="x ${sure ? 'sure' : ''}" onclick="${fn}(${id})">${sure ? 'Bekräfta' : 'Ta bort'}</button>`;
}
function postCard(p) {
  const best = p.answers.find(a => a.id === p.best_answer_id);
  return `<div class="post">${who(p.author, ago(p.created_at), `<span class="pill">${esc(p.category)}</span>`)}
  <h3><button class="plink" onclick="openPost(${p.id})">${esc(p.body)}</button></h3>
  ${best ? `<div class="ans"><b>Bästa svar</b>${esc(best.body)}</div>` : ''}
  <div class="prow">${likeBtn(p)}<button class="link2" onclick="openPost(${p.id})">${p.answers.length ? p.answers.length + ' svar' : 'Svara'}</button></div></div>`;
}
function comm() {
  if (S.post) return postV();
  let body;
  if (S.feedErr) body = `<div class="empty"><p>${esc(S.feedErr)}</p><button class="btn sm" onclick="loadFeed()">Försök igen</button></div>`;
  else if (!S.feed) body = '<p class="mut" style="text-align:center">Hämtar frågor…</p>';
  else if (!S.feed.length) body = '<div class="empty"><p>Inga frågor än. Bli först med att fråga något!</p></div>';
  else body = S.feed.map(postCard).join('');
  return `${topbar('Community')}<p class="mut" style="text-align:center;margin:0 18px">Fråga och hjälp andra växtvänner.</p>
  <div class="ask"><textarea id="nq" rows="2" maxlength="1000" placeholder="Vad undrar du över?" aria-label="Din fråga" oninput="S.draft=this.value">${esc(S.draft)}</textarea>
  <div class="askrow"><select aria-label="Kategori" onchange="S.qcat=this.value">${QCATS.map(c => `<option ${c === S.qcat ? 'selected' : ''}>${c}</option>`).join('')}</select><button class="btn sm" onclick="askQ()">Publicera</button></div></div>
  <div class="pad">${body}</div>`;
}
function postV() {
  const p = S.feed && S.feed.find(x => x.id === S.post);
  if (!p) { S.post = null; return comm(); }
  const mine = !!(S.user && p.user_id === S.user.id);
  const ans = [...p.answers].sort((a, b) => (b.id === p.best_answer_id) - (a.id === p.best_answer_id));
  return `${topbar('Fråga', 'S.post=null;S.del=null;render()')}<div class="pad">
  <div class="post" style="margin-top:10px">${who(p.author, ago(p.created_at), `<span class="pill">${esc(p.category)}</span>`)}<h2 style="font-size:21px">${esc(p.body)}</h2>
  <div class="prow">${likeBtn(p)}<span class="grow"></span>${mine ? delBtn('p', 'delPost', p.id) : `<button class="x" onclick="openReport('post',${p.id})">Rapportera</button>`}</div></div>
  <h3 style="margin:20px 0 10px">${p.answers.length ? p.answers.length + ' svar' : 'Inga svar än'}</h3>
  ${ans.map(a => {
    const isBest = a.id === p.best_answer_id, own = !!(S.user && a.user_id === S.user.id);
    return `<div class="post ${isBest ? 'bestc' : ''}">${who(a.author, ago(a.created_at), isBest ? '<span class="pill ok">Bästa svar</span>' : '')}<p style="margin:0">${esc(a.body)}</p>
    <div class="prow">${mine && !isBest ? `<button class="link2" onclick="markBest(${p.id},${a.id})">Markera som bästa svar</button>` : ''}<span class="grow"></span>${own ? delBtn('a', 'delAnswer', a.id) : `<button class="x" onclick="openReport('answer',${a.id})">Rapportera</button>`}</div></div>`;
  }).join('')}
  <div class="ask" style="margin:14px 0 0"><textarea id="na" rows="3" maxlength="1000" placeholder="Skriv ett svar" aria-label="Ditt svar" oninput="S.adraft=this.value">${esc(S.adraft)}</textarea><div style="margin-top:10px"><button class="btn sm" onclick="sendAnswer(${p.id})">Skicka svar</button></div></div></div>`;
}
function reportV() {
  return `<div class="mh"><h2>Rapportera</h2><button class="close" onclick="closeModal()" aria-label="Stäng">×</button></div>
  <p class="mut" style="margin:0 0 14px">Vad är fel? Rapporten går till den som sköter appen.</p>
  <form onsubmit="event.preventDefault();sendReport(this)">${REASONS.map((r, i) => `<label class="check"><input type="radio" name="reason" value="${r}" ${i === 0 ? 'checked' : ''}><span>${r}</span></label>`).join('')}
  <button class="btn wide formbtn">Skicka rapport</button></form>`;
}

// ===== Start =====
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('Kunde inte ladda ' + src)); document.head.appendChild(s); }); }
async function init() {
  render();
  try {
    if (!DEMO) {
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
      // Skickar headers som ett vanligt objekt, så att appen även fungerar i förhandsvisningar som inte klarar Headers-objekt
      const plainFetch = (input, init = {}) => {
        const opts = { ...init };
        if (opts.headers instanceof Headers) opts.headers = Object.fromEntries(opts.headers.entries());
        if (!opts.signal) delete opts.signal;
        return fetch(input, opts);
      };
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { global: { fetch: plainFetch } });
      api = sbApi;
    }
    S.plants = await api.plants();
    S.user = await api.user();
    S.mine = S.user ? await api.mine() : [];
  } catch (e) { S.err = e; }
  S.loading = false; render();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) closeModal(); });
init();
</script></body></html>
