<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roothood</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4D3A">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2ECE2;--surf:#FBF8F3;--ink:#16261D;--mut:#776F63;--line:#E4DCCE;--pri:#1F4D3A;--pri2:#4E8B3A;--onpri:#FFFFFF;--acc:#C2643F;--soft:#E6ECDF;--sun:#D49A2E;--wat:#3B8DB0;--cop:#C2643F;--gold:#D9A441;--leaf:#8BC06A;--glow:rgba(217,164,65,.20);--sh:0 8px 24px rgba(70,52,28,.09);--phb:#E9E2D4;--card:#1F4D3A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0D1C15;--surf:#15281F;--ink:#EFE8DB;--mut:#A3A699;--line:#24392D;--pri:#9DCB7F;--pri2:#5E9E48;--onpri:#0D1C15;--acc:#E38B63;--soft:#1C3328;--sun:#E3B65A;--wat:#6DB3D3;--cop:#E38B63;--gold:#E3B65A;--leaf:#9DCB7F;--glow:rgba(217,164,65,.10);--sh:0 8px 24px rgba(0,0,0,.4);--phb:#1E3328;--card:#1B3A2C}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0D1C15;--surf:#15281F;--ink:#EFE8DB;--mut:#A3A699;--line:#24392D;--pri:#9DCB7F;--pri2:#5E9E48;--onpri:#0D1C15;--acc:#E38B63;--soft:#1C3328;--sun:#E3B65A;--wat:#6DB3D3;--cop:#E38B63;--gold:#E3B65A;--leaf:#9DCB7F;--glow:rgba(217,164,65,.10);--sh:0 8px 24px rgba(0,0,0,.4);--phb:#1E3328;--card:#1B3A2C}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(110% 50% at 85% -8%,var(--glow),transparent 65%),radial-gradient(90% 40% at 0% 0%,rgba(139,192,106,.14),transparent 60%),var(--bg);position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
@media (min-width:600px){body{background:var(--line)}#app{height:min(100% - 40px,880px);margin:20px auto;border-radius:40px;box-shadow:var(--sh)}}
#main{flex:1;overflow-y:auto;padding-bottom:110px}
.pad{padding:0 18px}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.015em}
h1,h2,.hello b,.brand{font-family:'Montserrat','Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.02em}
.cap,.ti small,.dstats small,.pdgrid small,.dsum small,.fl{text-transform:uppercase;letter-spacing:.07em;font-size:11.5px!important;font-weight:700}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:16px;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:22px 18px 10px}
.sec h2{font-size:19px}

/* Toppfält */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:14px 18px 6px}
.top h1{font-size:19px;font-weight:800;text-align:center}
.circ{width:44px;height:44px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);position:relative;padding:0}
.circ.flat{box-shadow:none;background:none;cursor:default}
.logo{width:40px;height:40px;border-radius:13px;background:var(--pri);display:grid;place-items:center}
.dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surf)}
.badge{display:inline-block;font-size:12px;font-weight:600;background:var(--surf);color:var(--mut);border-radius:999px;padding:4px 10px;box-shadow:var(--sh)}

/* Sök */
.searchrow{display:flex;gap:10px;padding:10px 18px 0}
.search{position:relative;flex:1}
.search svg{position:absolute;left:16px;top:14px;color:var(--mut)}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.search input{padding:13px 16px 13px 46px;border:0;border-radius:999px;box-shadow:var(--sh)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* Foton */
.ph{position:relative;overflow:hidden;background:hsl(var(--h) 38% 86%);display:grid;place-items:center}
.ph>svg{width:72%;height:72%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ph.has-img img{opacity:1}
.ph.has-img>svg{visibility:hidden}

/* Hero */
.hero{position:relative;margin:16px 18px 0;border-radius:28px;overflow:hidden;min-height:190px;box-shadow:var(--sh);background:linear-gradient(135deg,#1F4D3A 0%,#143728 60%,#0F2C20 100%)}
.hero .ph{position:absolute;inset:0}
.hero .ph>svg{width:46%;height:auto;position:absolute;right:-6%;bottom:-8%}
.shade{position:absolute;inset:0;background:linear-gradient(100deg,rgba(12,38,27,.85) 0%,rgba(12,38,27,.5) 55%,rgba(12,38,27,.05) 100%)}
.hero-t{position:relative;padding:22px 20px 20px;color:#fff;max-width:80%}
.hero-t h2{font-size:24px;line-height:1.12}
.hero-t p{margin:8px 0 16px;font-size:14px;opacity:.9}
.pillbtn{border:0;background:linear-gradient(135deg,#E4B865,#D9A441);color:#16261D;font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:10px 18px;cursor:pointer}
.pillbtn.green{background:var(--pri2);color:#fff}

/* Flikar */
.tabs{display:flex;gap:22px;overflow-x:auto;padding:0 18px;border-bottom:1px solid var(--line);margin:0 18px;padding:0;scrollbar-width:none}
.tab{flex:none;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;font-size:15px;padding:6px 0 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--ink);font-weight:800}

/* Växtrutnät */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding:16px 18px 0}
.card{position:relative}
.card .open{all:unset;display:block;cursor:pointer;width:100%}
.card .open:focus-visible{outline:2px solid var(--pri);outline-offset:3px;border-radius:24px}
.card .ph{aspect-ratio:1/1.05;border-radius:24px;box-shadow:var(--sh)}
.card h3{margin:10px 2px 0;font-size:15px}
.card i{display:block;font-size:13px;color:var(--mut);margin:1px 2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list.grid{grid-template-columns:repeat(3,1fr);gap:14px 10px}
#list .card{min-width:0}
#list .card .ph{aspect-ratio:1/1;border-radius:18px;width:100%}
#list .card h3{margin:7px 1px 0;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#list .card i{font-size:11px;margin:1px 1px 0}
#list .card .heart{top:6px;right:6px;width:30px;height:30px}
#list .card .heart svg{width:16px;height:16px}
#list .empty{grid-column:1/-1}
@media (min-width:600px){#list.grid{grid-template-columns:repeat(4,1fr)}}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.88);display:grid;place-items:center;cursor:pointer;color:#B9BDB9;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.heart.on{color:var(--acc)}
.empty{grid-column:1/-1;background:var(--surf);border-radius:24px;padding:22px;text-align:center;box-shadow:var(--sh)}
.empty p{margin:0 0 14px;color:var(--mut)}

/* Knappar */
.btn{border:0;background:var(--pri);color:var(--onpri);box-shadow:0 6px 16px rgba(31,77,58,.18);font:inherit;font-weight:700;border-radius:999px;padding:13px 20px;cursor:pointer}
.btn:active,.circ:active,.heart:active,.pillbtn:active,.wbtn:active{transform:scale(.95)}
.btn.wide{width:100%}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.line{background:none;color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.btn:disabled{opacity:.6}
.btn[disabled]{background:var(--soft);color:var(--mut);box-shadow:none;cursor:default}
.link{border:0;background:none;color:var(--pri);font:inherit;font-weight:700;padding:0;cursor:pointer}
.x{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px}
.x.sure{color:var(--acc)}

/* Växtsida */
.dhero{position:relative;margin:6px 18px 0;border-radius:30px;overflow:hidden;aspect-ratio:1.25/1;box-shadow:var(--sh)}
.dhero .ph{position:absolute;inset:0}
.dhero .shade{background:linear-gradient(0deg,rgba(8,26,10,.82) 0%,rgba(8,26,10,.25) 55%,rgba(8,26,10,0) 100%)}
.dhero-t{position:absolute;left:0;right:0;bottom:0;padding:18px;color:#fff}
.dhero-t h1{font-size:30px}
.dhero-t i{display:block;opacity:.9;margin:2px 0 12px}
.credit{display:block;text-align:right;font-size:11px;color:var(--mut);padding:6px 22px 0}
.credit a{color:inherit}
.tag{display:inline-block;background:var(--surf);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:var(--sh)}
.tag.green{background:var(--pri2);color:#fff;box-shadow:none}
.tag.warn{background:var(--acc);color:#fff;box-shadow:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.ti{background:var(--surf);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--sh);position:relative;min-height:128px}
.ti small{display:block;color:var(--mut);font-size:13px;font-weight:600}
.ti b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--pri);font-size:16px;font-weight:800;margin:2px 0 6px;padding-right:34px}
.ti b.bad{color:var(--acc)}
.ti p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ti .ic{position:absolute;top:12px;right:12px}
.tips{padding:0 18px;display:flex;flex-direction:column;gap:10px}
.tipr{display:flex;gap:12px;align-items:flex-start;background:var(--surf);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.tipr .ck{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center}
.tipr b{display:block;font-size:13px;color:var(--mut);font-weight:600}
.tipr span{font-size:14.5px}
.addbar{padding:18px 18px 0}

/* Min samling */
.summary{margin:12px 18px 0;background:var(--pri);color:var(--onpri);border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.summary b{font-size:28px;font-weight:800;line-height:1}
.summary span{font-size:14px;opacity:.9}
.list{padding:14px 18px 0;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;gap:12px;align-items:center;background:var(--surf);border-radius:24px;padding:10px;box-shadow:var(--sh)}
.mrow .ph{width:74px;height:74px;border-radius:18px;flex:none}
.mrow .grow{flex:1;min-width:0}
.mrow h3 button{all:unset;cursor:pointer}
.mrow h3 button:focus-visible{outline:2px solid var(--pri)}
.side{display:flex;flex-direction:column;align-items:center;gap:2px}
.wbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--pri);color:var(--onpri);display:grid;place-items:center;cursor:pointer}
.wbtn.due{background:var(--wat)}
.bar{height:7px;border-radius:9px;background:var(--line);margin:8px 0 5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:9px}
.bar.due i{background:var(--wat)}
.due-t{color:var(--wat);font-weight:700;font-size:14px}
.note{font-size:13px;color:var(--mut);margin-top:3px}
.mini{display:inline-block;background:var(--soft);color:var(--pri);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;margin-top:3px}

/* Profil */
.prof{margin:16px 18px 0;background:var(--surf);border-radius:28px;padding:24px 18px;text-align:center;box-shadow:var(--sh)}
.bigav{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800;background:var(--pri)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px 0}
.stat{background:var(--surf);border-radius:22px;padding:16px;box-shadow:var(--sh)}
.stat b{display:block;color:var(--pri);font-size:26px;font-weight:800}
.about{margin:12px 18px 0;color:var(--mut);font-size:13.5px;text-align:center}

/* Community */
.post{background:var(--surf);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.who{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.who>div:not(.av){flex:1;line-height:1.25}
.pill{display:inline-block;background:var(--soft);color:var(--pri);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.pill.ok{background:var(--pri);color:var(--onpri)}
.ans{background:var(--soft);border-radius:18px;padding:12px 14px;margin:12px 0 0;font-size:15px}
.ans b{display:block;font-size:12.5px;color:var(--pri);margin-bottom:2px}
.like{border:0;background:var(--soft);color:var(--mut);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.like.on{background:var(--acc);color:#fff}
.ask{background:var(--surf);border-radius:24px;padding:14px;margin:12px 18px 6px;box-shadow:var(--sh)}
.ask textarea{border:0;background:var(--bg);resize:none;border-radius:16px}
.askrow{display:flex;gap:10px;margin-top:10px}
.askrow select{flex:1;padding:9px 12px;background:var(--bg);border:0;border-radius:999px}
.prow{display:flex;gap:14px;align-items:center;margin-top:12px}
.prow .grow{flex:1}
.plink{all:unset;cursor:pointer}
.plink:focus-visible{outline:2px solid var(--pri)}
.link2{border:0;background:none;color:var(--pri);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px 0}
.bestc{box-shadow:inset 0 0 0 2px var(--pri),var(--sh)}
.center{padding:80px 24px;text-align:center}

/* Bottenmeny */
nav{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0));display:flex;justify-content:space-between;align-items:center;background:var(--surf);border-radius:999px;padding:8px;box-shadow:0 10px 30px rgba(20,50,22,.16);z-index:5}
nav button{border:0;width:52px;height:52px;border-radius:999px;background:var(--bg);color:var(--mut);display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;padding:0;flex:none}
nav button span{display:none}
nav button.on{width:auto;padding:0 22px;background:var(--pri);color:var(--onpri)}
nav button.on span{display:inline}

/* Rutor och formulär */
.ov{position:absolute;inset:0;background:rgba(8,20,10,.45);z-index:10;display:flex;align-items:flex-end}
.modal{width:100%;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0))}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.close{width:40px;height:40px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:var(--sh)}
form label{display:block;font-size:14px;font-weight:700;margin-bottom:14px}
form label input,form label select,form label textarea{margin-top:6px;font-weight:400}
form label.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;background:var(--surf);border-radius:16px;padding:12px 14px}
form label.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--pri)}
.modal label.check{margin-bottom:8px}
.modal label.check+.formbtn{margin-top:8px}
.taxbox{background:var(--surf);border-radius:18px;padding:14px 14px 2px;margin:0 0 14px;box-shadow:var(--sh)}
.taxbox>b{display:block;font-size:14px;margin-bottom:10px}
.taxline{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.sameln{display:flex!important;gap:10px;align-items:center;font-weight:600!important;margin:-6px 0 14px!important;cursor:pointer}
.sameln input{width:20px!important;height:20px;margin:0!important;flex:none;accent-color:var(--pri)}
input.ro{opacity:.65}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{background:var(--surf);border-radius:18px;padding:14px 14px 2px;margin-bottom:14px}
.seg{display:flex;background:var(--surf);border-radius:999px;padding:4px;margin-bottom:16px;box-shadow:var(--sh)}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:10px 0;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--onpri)}
.formmsg{background:var(--surf);border-left:4px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.formmsg.ok{border-color:var(--pri)}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;width:max-content;max-width:calc(100% - 40px)}
/* Hälsning och segment */
.hello{display:flex;align-items:center;gap:12px;padding:16px 18px 4px}
.hello .grow{flex:1;min-width:0}
.hello b{display:block;font-size:19px;font-weight:800}
.hello span{font-size:13.5px;color:var(--mut)}
.lfil{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 18px 0}
.lfil input{flex:1;min-width:140px;padding:9px 14px;border-radius:999px}
.lcard{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;background:var(--surf);border-radius:22px;padding:12px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer}
.lcard:focus-visible{outline:2px solid var(--pri)}
.lcard.taken{opacity:.55}
.lthumb{flex:none;width:84px;height:84px;border-radius:16px;overflow:hidden;background:var(--soft);display:grid;place-items:center;color:var(--pri)}
.lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.lthumb .ph{width:100%;height:100%;border-radius:0}
.lcard .grow{flex:1;min-width:0}
.lcard b{display:block;font-size:16px;margin:4px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .mut{font-size:13px}
.ltype{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fff}
.lbig{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:18px;margin:12px 0 4px}
.lnote{background:var(--soft);color:var(--ink);border-radius:16px;padding:10px 12px;font-size:13.5px;margin:14px 0 0}
.seg2{display:flex;gap:6px;margin:14px 18px 0;background:var(--surf);border-radius:999px;padding:5px;box-shadow:var(--sh)}
.seg2 button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:10px 0;border-radius:999px;cursor:pointer}
.seg2 button.on{background:var(--pri);color:var(--onpri)}
.viewall{border:0;background:var(--surf);color:var(--ink);font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:var(--sh)}
/* Mina växter */
.mycards{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none}
.mycard{flex:none;width:168px;background:var(--surf);border-radius:24px;padding:8px 8px 12px;box-shadow:var(--sh);border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.mycard .ph{height:132px;border-radius:18px;background:var(--phb)}
.mycard h3{font-size:14.5px;margin:10px 4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.mstats div{font-size:11.5px;font-weight:600;color:var(--ink)}
.mstats i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;margin:0 auto 4px}

  light: ['Norr', 'Öst', 'Söder', 'Väster', 'Växtlampa', 'Inget fönster', 'Ute i sol', 'Ute i skugga']

function pdHints(m, d) {
  const h = [], p = S.plants.find(x => x.id === m.plant_id), soil = d.soil || [], cat = p ? p.category : m.category;
  const pot = !d.place || ['Kruka', 'Ampel'].includes(d.place);
  if (pot && d.drain === 'Nej' && !d.self) h.push(['warn', 'Krukan saknar dräneringshål. Vattna lite i taget och häll ut vatten som blir stående, annars kan rötterna ruttna.']);
  if (d.self) h.push(['', 'Självvattnande kruka: fyll på behållaren när den är tom och låt den gärna stå tom ett par dagar emellan, så att rötterna får luft.']);
  if (d.mat === 'Terrakotta') h.push(['', 'Terrakotta andas och torkar snabbare än plast. Känn på jorden lite oftare.']);
  if (d.mat === 'Ytterkruka') h.push(['', 'Med ytterkruka: kolla att inget vatten blir stående i botten efter vattning.']);
  if (d.place === 'Semi-hydro' || soil.includes('Leca') || soil.includes('Pon')) h.push(['', 'I leca, pon eller semi-hydro: håll vattnet på ungefär en tredjedel av krukans höjd och använd näring för hydrokultur.']);
  const rmH = roomOf(m, d); if (rmH) roomHints(p, rmH, d.win).forEach(x => h.push(x)); if (d.pos) posHints({ details: d }).forEach(x => h.push(x));
  else if (p && p.light_level === 3 && ['Norr', 'Inget fönster', 'Ute i skugga'].includes(d.light)) h.push(['warn', `${p.swedish_name} vill ha mycket ljus. ${d.light === 'Norr' ? 'Ett norrfönster' : 'Den platsen'} kan bli för mörk, prova en ljusare plats eller en växtlampa.`]);
  if (!rmH && p && p.light_level === 1 && ['Söder', 'Ute i sol'].includes(d.light)) h.push(['warn', `${p.swedish_name} trivs i skugga. Stark sol kan bränna bladen, ställ den en bit från fönstret.`]);
  if (cat === 'Kaktus' && soil.length && !soil.some(x => ['Kaktusjord', 'Pimpsten', 'Perlit', 'Leca'].includes(x))) h.push(['warn', 'Suckulenter vill ha luftig jord som torkar snabbt. Blanda gärna i perlit eller pimpsten.']);
  if (cat === 'Orkidé' && soil.includes('Krukjord')) h.push(['warn', 'Orkidéer kvävs i vanlig krukjord. Använd orkidébark så att rötterna får luft.']);
  return h;
}
function growthTxt(d) {
  const hs = (d.hist || []).filter(x => x.h > 0);
  if (hs.length < 2) return '';
  const a = hs[0], b = hs[hs.length - 1], diff = b.h - a.h;
  if (!diff) return '';
  const [, mo, dd] = a.d.split('-').map(Number);
  return `${diff > 0 ? '+' : ''}${diff} cm sedan ${dd} ${MONTHS[mo - 1]}`;
}

  return `${inModal ? '' : `<div class="sec"><h2>Om min växt</h2>${items.length ? `<button class="link3" onclick="openDetails(${m.id})">Ändra</button>` : ''}</div>`}<div class="pdbox ${inModal ? 'inm' : ''}">${head}

function showPhotos() {

async function loadPhotos() {
  showPhotos();

  const want = [...new Set([...document.querySelectorAll('.ph[data-latin]')].map(e => e.dataset.latin))]
    .filter(l => l && !(l in IMG) && !imgTried.has(l));
  if (!want.length) return;
  imgBusy = true; want.forEach(l => imgTried.add(l));
  try {
    for (let i = 0; i < want.length; i += 40) {
      const batch = want.slice(i, i + 40);
      const r = await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=640&redirects=1&format=json&origin=*&titles=' + encodeURIComponent(batch.join('|')));
      const q = (await r.json()).query || {};

      const pages = Object.values(q.pages || {});
      batch.forEach(l => {
        const t = follow(follow(l, q.normalized), q.redirects);
        const p = pages.find(x => x.title === t);
        IMG[l] = p && p.thumbnail ? { src: p.thumbnail.source, page: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g, '_')) } : null;

function homeBlocks(intro) {

function ago(t) {
  const s = (Date.now() - Date.parse(t)) / 1000;
  if (s < 60) return 'nyss';
  if (s < 3600) return Math.floor(s / 60) + ' min sedan';
  if (s < 86400) return Math.floor(s / 3600) + ' tim sedan';
  const d = Math.floor(s / 86400);
  if (d === 1) return 'igår';
  if (d < 7) return d + ' dagar sedan';
  return new Date(t).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
}

const isForum = () => S.ctab === 'forum';
const isSwap = () => S.ctab === 'swap';

  return { pts, top: Object.keys(pts).map(u => [u, names[u], pts[u]]).sort((a, b) => b[2] - a[2]) };
}
const myId = () => S.user ? (DEMO ? 'demo' : S.user.id) : null;
function caseImg(c, cls) {

function docScores() {
  const sel = S.docSym || [], m = S.docMine ? S.mine.find(x => x.id === S.docMine) : null, pl = m ? S.plants.find(x => x.id === m.plant_id) : null;
  if (!sel.length) return [];
  return CAUSE.map(c => { let sc = 0, hit = 0; sel.forEach(k => { if (c.w[k]) { sc += c.w[k]; hit++; } }); if (!hit) return null;
    const miss = sel.length - hit;
    let bonus = 0, why = [];
    if (pl && c.id === 'dryAir' && /hög/i.test(pl.humidity || '')) { bonus += 1; why.push(pl.swedish_name + ' vill ha fuktig luft'); }
    if (pl && c.id === 'rot' && (pl.category === 'Kaktus' || pl.water_level === 1)) { bonus += 1; why.push(pl.swedish_name + ' vill ha lite vatten'); }
    if (m && m.details && m.details.pos && ['dryAir', 'spider'].includes(c.id) && posHints(m).some(h => /element/.test(h[1]))) { bonus += 1; why.push('Står nära ett element'); }
    if (pl && c.id === 'dark' && pl.light_level === 3) { bonus += 1; why.push(pl.swedish_name + ' vill ha mycket ljus'); }
    if (m && c.id === 'thirst' && left(m) === 0) { bonus += 1; why.push('Den behöver vatten enligt appen'); }
    const M = sc + bonus; return { c, sc: M - miss * 1.5, pct: Math.max(5, Math.min(95, Math.round(100 * M / (M + 3 * miss) * Math.min(1, M / 5)))), why }; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 4);

// ===== Påminnelser i mobilen (push-notiser) =====
const BELL = '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>';
const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext && location.protocol !== 'file:';
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error('Appens bakgrundsdel startade inte. Ladda om sidan.')), 4000))]);
const b64u = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function refreshPush() {
  let st = 'unsupported';
  if (pushOk()) {
    if (Notification.permission === 'denied') st = 'denied';
    else if (DEMO) st = store.get('pushDemo', false) && Notification.permission === 'granted' ? 'on' : 'off';
    else { try { const reg = await swReady(); st = (await reg.pushManager.getSubscription()) ? 'on' : 'off'; } catch (e) { st = 'unsupported'; } }
  }
  if (S.push !== st) { S.push = st; render(); }
}
async function enablePush() {
  if (!S.user) return openModal('login');
  if (!pushOk()) return toast('Notiser fungerar inte här. Öppna appen i Chrome.');
  S.pushBusy = true; render();
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast(perm === 'denied' ? 'Notiser är blockerade i Chrome' : 'Tryck på Tillåt för att få påminnelser'); return; }
    if (DEMO) { store.set('pushDemo', true); toast('Påminnelser är på (demoläge)'); return; }
    const reg = await swReady();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC_KEY) });
    await api.savePush(sub);
    try { await api.setPushHour(sub.endpoint, store.get('pushHour', 8)); } catch (e) {}
    toast('Påminnelser är på! 🌱');
  } catch (e) { toast('Kunde inte slå på notiser: ' + (e.message || e)); }
  finally { S.pushBusy = false; await refreshPush(); render(); }
}
async function setPushHour(h) {
  store.set('pushHour', h);
  try {
    if (!DEMO) { const reg = await swReady(), sub = await reg.pushManager.getSubscription(); if (sub) await api.setPushHour(sub.endpoint, h); }
    toast('Påminnelsen kommer kl ' + String(h).padStart(2, '0') + '.00');
  } catch (e) { toast(e.message === 'HOUR_NOT_READY' ? 'Tidsval är inte påslaget i databasen än.' : errMsg(e)); }
}
async function disablePush() {
  S.pushBusy = true; render();
  try {
    if (DEMO) { store.set('pushDemo', false); toast('Påminnelser är avstängda'); return; }
    const reg = await swReady(), sub = await reg.pushManager.getSubscription();
    if (sub) { const ep = sub.endpoint; await sub.unsubscribe(); try { await api.deletePush(ep); } catch (e) {} }
    toast('Påminnelser är avstängda');
  } catch (e) { toast('Något gick fel: ' + (e.message || e)); }
  finally { S.pushBusy = false; await refreshPush(); render(); }
}
async function testPush() {

      const reg = await swReady();

    const { data } = await sb.auth.getSession();
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-reminders', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + (data.session ? data.session.access_token : '') }, body: '{"test":true}' });
    if (res.status === 404) throw new Error('notisfunktionen finns inte i Supabase än');
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || out.msg || 'fel ' + res.status);
    toast(out.sent ? 'Testnotis skickad! Den kommer om några sekunder.' : 'Hittade ingen mobil. Stäng av och slå på igen.');
  } catch (e) { toast('Kunde inte skicka: ' + (e.message || e)); }
  finally { S.pushBusy = false; render(); }
}
function pushCard() {

// ===== Välj kamera eller galleri =====
// Android öppnar annars bara kameran (med capture) eller bara galleriet (utan). Vi frågar själva.
let pickInput = null;
function photoPick(e, label) {

function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('Kunde inte ladda ' + src)); document.head.appendChild(s); }); }
async function init() {
  applyPrefs();
  render();
  try {
    if (!DEMO) {
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
      // Skickar headers som ett vanligt objekt, så att appen även fungerar i förhandsvisningar som inte klarar Headers-objekt
      const plainFetch = (input, init = {}) => {
        const opts = { ...init };
        if (opts.headers instanceof Headers) opts.headers = Object.fromEntries(opts.headers.entries());
        if (!opts.signal) delete opts.signal;
        return fetch(input, opts);
      };
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { global: { fetch: plainFetch } });
      if (sb.auth.onAuthStateChange) sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') setTimeout(() => { S.msg = ''; openModal('newpw'); }, 300); });
      api = sbApi;
    }
    S.plants = await api.plants();
    S.user = await api.user();
    S.mine = S.user ? await api.mine() : [];
    S.pro = S.user ? await api.getPro() : false;
    if (S.user) { try { const pr = await api.getProfile(); S.city = pr.city || ''; applyInterests(pr.interests); } catch (e) {} }
    if (S.user) loadHome();
  } catch (e) { S.err = e; }
  S.loading = false;
  let restoreY = null;
  try { restoreY = restoreView(); } catch (e) {}
  const startTab = new URLSearchParams(location.search).get('tab');
  if (startTab === 'mine') { S.tab = 'mine'; try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  const startTool = new URLSearchParams(location.search).get('tool');
  if (startTool === 'id') { try { history.replaceState(null, '', location.pathname); } catch (e) {} setTimeout(() => { openTool('id'); if (S.tool === 'id') startIdCam(); }); }
  render();
  if (restoreY) setTimeout(() => { const m = $('#main'); if (m) m.scrollTop = restoreY; }, 350);
  $('#main').addEventListener('scroll', () => { clearTimeout(scrollT); scrollT = setTimeout(saveView, 400); }, { passive: true });
  if (S.user) refreshPush();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) closeModal(); });
